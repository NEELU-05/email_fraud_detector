<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Fraud Detector</title>
    <style>
        body {
            width: 320px;
            padding: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }

        .title h1 {
            margin: 0;
            font-size: 18px;
            color: #1a1a1a;
        }

        .status-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-text {
            font-size: 14px;
            font-weight: 600;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #ec1313;
        }

        input:checked+.slider:before {
            transform: translateX(16px);
        }

        .backend-status {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ccc;
        }

        .online {
            background-color: #22c55e;
        }

        .offline {
            background-color: #ef4444;
        }
    </style>
</head>

<body>
    <div class="header">
        <div style="font-size: 24px;">🛡️</div>
        <div class="title">
            <h1>Fraud Detector</h1>
        </div>
    </div>

    <div class="status-card">
        <span class="status-text">Auto-Scan Emails</span>
        <label class="toggle-switch">
            <input type="checkbox" id="autoScanToggle" checked>
            <span class="slider"></span>
        </label>
    </div>

    <div class="backend-status">
        <div class="dot" id="backendDot"></div>
        <span id="backendText">Checking server...</span>
    </div>

    <script src="popup.js"></script>
</body>

</html>
